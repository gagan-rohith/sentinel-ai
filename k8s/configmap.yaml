apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel-ai
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  DATABASE_PATH: /data/sentinel.db
  EVAL_REPORTS_DIR: /data/reports
  SEARCH_BACKEND: elasticsearch
  # Elasticsearch is not managed by these manifests: point this at ECK, Elastic Cloud or
  # another cluster reachable from the namespace.
  ELASTICSEARCH_URL: http://elasticsearch.sentinel.svc.cluster.local:9200
  ELASTICSEARCH_INDEX: sentinel-knowledge
  EMBEDDING_PROVIDER: sentence-transformers
  # The ingest Job builds the index; the API only reads it.
  AUTO_INDEX: "false"
  LLM_PROVIDER: auto
  LLM_MODEL: claude-sonnet-5-5
  TOOL_TIMEOUT_SECONDS: "5"
  MAX_CRITIC_RETRIES: "3"
  # The API delegates plan review to the critic service over A2A.
  CRITIC_MODE: a2a
  CRITIC_URL: http://sentinel-critic.sentinel.svc.cluster.local:8100
  CRITIC_PUBLIC_URL: http://sentinel-critic.sentinel.svc.cluster.local:8100
  CRITIC_TIMEOUT_SECONDS: "10"
